[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = platformio/renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
platform_packages =
    platformio/framework-arduinorenesas-uno@1.6.0
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/tool-bossac@1.10901.0
monitor_speed = 115200
build_src_filter = +<*> -<sniffer_main.cpp>
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

[env:sniffer]
extends = env:uno_r4_wifi
board = uno_r4_minima
build_src_filter = -<*> +<sniffer_main.cpp>

[env:host]
platform = platformio/native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = yes
test_filter = test_control
build_src_filter = +<*> -<sniffer_main.cpp>
build_flags = -std=c++17 -Wall -Wextra -Werror -Itest/fakes
extra_scripts = pre:tools/host_compiler.py
